name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # This runs whenever you upload to the 'main' branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We removed the caching requirement here!

      - name: Install dependencies
        working-directory: ./e3t-—-engagement-estimation-&-evaluation-tool
        run: npm install

      - name: Build
        working-directory: ./e3t-—-engagement-estimation-&-evaluation-tool
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './e3t-—-engagement-estimation-&-evaluation-tool/dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
